name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci && npm run build
        working-directory: viewer
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-dist
          path: viewer/dist

  binaries:
    needs: viewer
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: viewer-dist
          path: viewer/dist
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p hoshizora
      - run: tar -C target/release -czf hoshizora-${{ github.ref_name }}-${{ matrix.target }}.tar.gz hoshizora
      - uses: softprops/action-gh-release@v2
        with:
          files: hoshizora-*.tar.gz
          generate_release_notes: true

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/dorskfr/hoshizora:${{ github.ref_name }}
            ghcr.io/dorskfr/hoshizora:latest
